# Publishing is **irreversible**: a version published to Maven Central exists forever.
# It therefore hangs on a `v*` tag rather than on a push to master, and
# `workflow_dispatch` only verifies.

name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The GitHub runner image already carries the Android SDK and ANDROID_HOME.

      - uses: gradle/actions/setup-gradle@v4

      # The tag must name the version in the build file. A mismatch would publish the wrong
      # version number, and that number is spent forever.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          declared=$(grep -oP '^version = "\K[^"]+' library/build.gradle.kts)
          if [ "v$declared" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version $declared in library/build.gradle.kts"
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches the declared version $declared."

      - name: Unit tests
        run: ./gradlew :library:testDebugUnitTest --console=plain

      - name: Assemble the release AAR
        run: ./gradlew :library:assembleRelease --console=plain

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The GitHub runner image already carries the Android SDK and ANDROID_HOME.

      - uses: gradle/actions/setup-gradle@v4

      # The bundle is assembled locally and uploaded to the Central Portal, so the build
      # does not depend on a publishing plugin whose version would also have to be pinned.
      - name: Build the signed publication into a local staging directory
        env:
          MAVEN_CENTRAL_SIGNING_KEY: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY }}
          MAVEN_CENTRAL_SIGNING_PASSWORD: ${{ secrets.MAVEN_CENTRAL_SIGNING_PASSWORD }}
        run: ./gradlew :library:publishReleasePublicationToStagingRepository --console=plain

      - name: Bundle the staging directory
        run: |
          cd library/build/staging
          zip -r ../qualia-bioauth-android.zip .

      - name: Upload the bundle to Maven Central
        id: upload
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          response=$(curl --silent --show-error --fail \
            --user "$MAVEN_CENTRAL_USERNAME:$MAVEN_CENTRAL_PASSWORD" \
            --form "bundle=@library/build/qualia-bioauth-android.zip" \
            --form "publishingType=AUTOMATIC" \
            https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC)
          echo "deployment id: $response"
          echo "id=$response" >> "$GITHUB_OUTPUT"

      # The status endpoint answered 500 on every attempt while the deployment was still
      # being processed, so a 5xx is not treated as a verdict: the loop keeps asking until
      # the API either reports PUBLISHED/FAILED or the attempts run out. The authoritative
      # check is the repository itself, which is polled below.
      - name: Wait for the package to appear in Maven Central
        run: |
          url="https://repo1.maven.org/maven2/com/qiushui1012/lib/qualia-bioauth-android/0.1.0/qualia-bioauth-android-0.1.0.pom"
          for attempt in $(seq 1 90); do
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' "$url")
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "The package is on Maven Central."
              exit 0
            fi
            sleep 20
          done
          echo "::error::the package did not appear on Maven Central in time"
          exit 1
