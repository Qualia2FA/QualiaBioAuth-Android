name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The library compiles and tests against the published Android SDK; the Gradle
      # wrapper pins the Gradle version, so only the SDK is installed here.
      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :library:testDebugUnitTest --console=plain

      - name: Assemble the release AAR
        run: ./gradlew :library:assembleRelease --console=plain

      # A publication that cannot be assembled is worse than one that fails here: the
      # POM, the sources jar and the AAR are all produced by this task.
      - name: Check the publication builds
        run: ./gradlew :library:publishReleasePublicationToMavenLocal --console=plain
